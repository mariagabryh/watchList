<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
</head>

<body>
    
    <header>
        <nav class = "logo">
            
            <a href="index.html">WatchList</a>
        </nav>
    </header>
    <main>
        <h1>
            Crie sua conta
        </h1>
        <p>
            Preencha os dados abaixo para começar a montar sua lista
        </p>

        <form id="form-cadastro"> 
            
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
                <label for="senha">Senha:</label>
                <div class="campo-senha">
                    <input type="password" id="senha" name="senha" required>
                    <button type="button" class="olho" id="ver-senha">👁</button>
                </div>

                <label for="confirmar-senha">Confirmar Senha:</label>
                <div class="campo-senha">
                    <input type="password" id="confirmar-senha" name="confirmar-senha" required>
                    <button type="button" class="olho" id="ver-confirmar-senha">👁</button>
                </div>
            
            <p id="mensagem"></p>
            
            <button type="submit">Cadastrar</button>
            <p>Já tem uma conta? <a href="login.html">Fazer login</a></p>

        </form>
    </main>
    <footer>
        <p>Feito por Maria Clara. Projeto de portfólio.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
